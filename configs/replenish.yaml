# Deep-RL-Replenish Configuration
env:
  n_skus: 8                        # Number of SKUs tracked
  n_hubs: 3                        # Number of dark stores (e.g., Delhi, Gurgaon, Noida)
  horizon: 60                      # Episode length in days
  max_order_per_step: 30           # Max cases per SKU per hub per day
  lead_time_days: 2                # In-transit shipping lead time
  demand_mean: [5, 3, 8, 2, 12, 4, 6, 10]
  demand_std:  [2, 1, 3, 1,  4, 2, 2,  3]
  perishable_skus: [0, 2, 5]       # SKU indices that degrade (Milk, Paneer, Curd)
  shelf_life_days: 5               # Maximum shelf life before spoilage
  costs:
    holding_per_unit_per_day: 0.5
    stockout_per_unit: 10.0
    ordering_fixed: 5.0
    spoilage_per_unit: 8.0
  seed: 42

ppo:
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01

dqn:
  learning_rate: 0.0001
  buffer_size: 100000
  learning_starts: 5000
  batch_size: 64
  tau: 1.0
  gamma: 0.99
  exploration_fraction: 0.3

baselines:
  base_stock_service_level: 0.95
